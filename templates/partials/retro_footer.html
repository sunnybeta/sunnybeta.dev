
  <div class="retro-badges">
    {% for badge in site.retro.badges %}
      <span class="badge-88">{{ badge }}</span>
    {% endfor %}
  </div>

  <div class="retro-colophon">
    <p>&copy; {{ site.year }} {{ site.person.name }} | Made in {{ site.person.location }}</p>
    <p>Built with <span class="heart-88">&#9829;</span> and a text editor that predates me.</p>
    <p>Look at some of my projects on
      <a class="retro-link" href="{{ site.person.github_url }}" target="_blank" rel="noopener">GitHub</a>.</p>
  </div>
