
<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="/pro">
      <span class="logo-mark" aria-hidden="true"></span>
      {{ site.person.name }}
    </a>

    <nav class="site-nav" aria-label="Main">
      {% for nav in site.nav %}
        <a href="{{ nav.path }}"{% if nav.path == active %} class="active" aria-current="page"{% endif %}>{{ nav.label }}</a>
      {% endfor %}
    </nav>

    <div class="header-side">
      <a class="mode-link" href="/">indie mode</a>
    </div>
  </div>
</header>
